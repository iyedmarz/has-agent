[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "has-agent"
version = "0.1.0"
description = "Local, offline RAG agent for Haute Autorité de Santé (HAS) documents, with citations and groundedness checks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4",
    "chromadb>=0.5",
    "pypdf>=4.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
has-agent = "has_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
